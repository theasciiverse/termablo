# Builds Termablo's terminal version for the Asciiverse catalog: one
# archive per target, named termablo-<target>.tar.gz (Linux, macOS) or
# .zip (Windows), plus a SHA256SUMS file, attached to a GitHub release
# (hub/catalog/SCHEMA.md, release.source = "github").
#
# Upstream has no version numbers or tags, so tags look like
# v20261010-av.1: the date of the upstream commit we build, then our
# packaging release. The game (the main package, Bubble Tea) is pure Go,
# so with cgo off one Linux runner cross-builds every target and the
# Linux binaries are static (named musl, the target av looks for first).
# The dev tools in cmd/ are not shipped.

name: asciiverse-release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: termablo
  BIN: termablo
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          while read -r goos goarch target; do
            ext=; [ "$goos" = windows ] && ext=.exe
            rm -rf stage && mkdir stage
            GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "-w -s" -o "stage/$BIN$ext" .
            cp LICENSE UPDATES.md PATCHES.md stage/
            cp asciiverse/README.md stage/README.md
            if [ "$goos" = windows ]; then
              (cd stage && zip -q -r "../dist/$ID-$target.zip" .)
            else
              tar -czf "dist/$ID-$target.tar.gz" -C stage .
            fi
            file "stage/$BIN$ext"
          done <<'TARGETS'
          linux amd64 x86_64-unknown-linux-musl
          linux arm64 aarch64-unknown-linux-musl
          darwin amd64 x86_64-apple-darwin
          darwin arm64 aarch64-apple-darwin
          windows amd64 x86_64-pc-windows-msvc
          windows arm64 aarch64-pc-windows-msvc
          TARGETS

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Termablo $TAG" \
                 --notes "Termablo by Anton Medvedev (github.com/antonmedv/termablo), as of upstream's ${TAG%%-av.*} commit, built for the Asciiverse catalog: one binary for Linux, macOS and Windows. MIT licence. Changes: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
